<!DOCTYPE html>
<html lang="en-UK">
  <head>
    <meta http-equiv="Content-Type" content="text/html"/>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Star Realms Authority Tracker</title>
    <meta name="description" content="An unofficial authority tracker for the card game Star Realms by Wise Wizard Games LLC"/>
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./assets/favicon/favicon-16x16.png">
    <link rel="manifest" href="./assets/favicon/site.webmanifest?v=${version}">
    <link rel="mask-icon" href="./assets/favicon/safari-pinned-tab.svg" color="#00aba9">
    <meta name="msapplication-TileColor" content="#00aba9">
    <meta name="theme-color" content="#333333">
    <meta property="og:title" content="Star Realms Authority Tracker">
    <meta property="og:description" content="An unofficial Star Realms authority tracker">
    <meta property="og:image" content="https://chronodave.github.io/star-realms-authority/assets/og-image.png">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://chronodave.github.io/star-realms-authority/">
    <link href="./index.css?v=${version}" type="text/css" rel="stylesheet">
    <script src="./index.js?v=${version}" defer></script>
  </head>
  <body>
    <header>
      <h1>Star Realms Authority Tracker</h1>
      <div class="toolbar">
        <label for="player">Players</label>
        <select id="players">
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
        </select>
        <label for="authority">Authority</label>
        <input type="text" id="authority" value="50" inputmode="numeric" pattern="[0-9]*">
        <button type="button">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="icon"><path d="M10,4V1L14,5L10,9V6A6,6 0 0,0 4,12L4.08,13H2.06L2,12A8,8 0 0,1 10,4M17,2H20A2,2 0 0,1 22,4V20A2,2 0 0,1 20,22H17A2,2 0 0,1 15,20V4A2,2 0 0,1 17,2M4,15H13V22H4A2,2 0 0,1 2,20V17A2,2 0 0,1 4,15Z" /></svg>
          <span class="sr-only">Change orientation</span>
        </button>
        <button type="button">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="icon"><path d="M13,3A9,9 0 0,0 4,12H1L4.89,15.89L4.96,16.03L9,12H6A7,7 0 0,1 13,5A7,7 0 0,1 20,12A7,7 0 0,1 13,19C11.07,19 9.32,18.21 8.06,16.94L6.64,18.36C8.27,20 10.5,21 13,21A9,9 0 0,0 22,12A9,9 0 0,0 13,3Z" /></svg>
          <span class="sr-only">Reset</span>
        </button>
        <button type="button" aria-haspopup="dialog" aria-controls="dialog-info">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="icon"><path d="M13,9H11V7H13M13,17H11V11H13M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2Z" /></svg>
          <span class="sr-only">About</span>
        </button>
      </div>
    </header>
    <main>
      <noscript>This page requires JavaScript. Please enable JavaScript and reload the page.</noscript>
    </main>
    <dialog id="dialog-info">
      <h2>About</h2>

    </dialog>

    </footer>
  </body>
</html>
